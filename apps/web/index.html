<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create and print Spelling lessons with sections, text, and images."
    />
    <!-- Site-wide social defaults. The SPA overrides these per page (see
         src/lib/seo.js); the Worker prerenders pages for crawlers so the
         per-page values end up in the snapshot scrapers receive. -->
    <meta property="og:site_name" content="Spelling Lesson Maker" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Spelling Lesson Maker" />
    <meta
      property="og:description"
      content="Create and print Spelling lessons with sections, text, and images."
    />
    <!-- Homepage screenshot rendered by the Worker (/og-image). The SPA swaps in
         a per-page screenshot via src/lib/seo.js; this is the default a scraper
         sees if the page isn't prerendered. -->
    <meta
      property="og:image"
      content="https://spellingcreator.org/og-image?path=/"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    />
    <title>Spelling Lesson Maker</title>
    <link rel="icon" href="/src/favicon.svg" type="image/svg+xml" />
    <!-- Cloudflare Turnstile. Explicit render so we can mount the widget
         inside the AI dialog on demand and read its verified token. -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>
    <!-- Google Identity Services. Provides the OAuth2 token client used to
         save lessons to the signed-in user's Google Drive as Google Docs. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
