name: CI

# Runs the checks on every pull request, and on master after a merge.
#
# Until this existed, deploy.yml was the only workflow, and it only triggers on a
# push to master — so nothing lint-checked or tested a pull request, and the test
# suites across core/api/mcp only ever ran on someone's laptop. A deploy that
# fails its lint step has already been merged by the time it fails.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # --frozen-lockfile (unlike deploy.yml's plain install) fails rather than
      # silently resolving a lockfile that doesn't match the manifests, which is
      # exactly the drift a PR should be caught on.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      # Runs every workspace's `test` script: core (vitest), api (vitest under
      # @cloudflare/vitest-pool-workers) and mcp (node --test). apps/docs has no
      # test script and is skipped.
      - name: Test
        run: pnpm -r test

      # No VITE_* secrets here: they are injected only for the real deploy, and a
      # pull request from a fork could not read them anyway. The build still
      # type-checks nothing but does resolve every import and run the full bundler,
      # which is what catches a bad module path or a broken chunk boundary.
      - name: Build web app
        run: pnpm --filter @spelling-creator/web build

      - name: Build docs
        run: pnpm --filter @spelling-creator/docs build
