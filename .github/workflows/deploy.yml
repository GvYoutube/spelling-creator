name: Deploy to GitHub Pages

on:
  push:
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Debug env
        run: |
          test -n "${{ secrets.VITE_API_URL }}" && echo "api ok"
          test -n "${{ secrets.VITE_TURNSTILE_SITE_KEY }}" && echo "turnstile ok"
          test -n "${{ secrets.VITE_GOOGLE_CLIENT_ID }}" && echo "google cloud ok"
          test -n "${{ secrets.VITE_SUPABASE_URL }}" && echo "supabase url ok"
          test -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" && echo "supabase anon key ok"
          test -n "${{ secrets.VITE_METERED_USER }}" && echo "metered username ok"
          test -n "${{ secrets.VITE_METERED_PASS }}" && echo "metered password ok"

      - name: Inject env vars
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> apps/web/.env
          echo "VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}" >> apps/web/.env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> apps/web/.env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> apps/web/.env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> apps/web/.env
          echo "VITE_METERED_USER=${{ secrets.VITE_METERED_USER }}" >> apps/web/.env
          echo "VITE_METERED_PASS=${{ secrets.VITE_METERED_PASS }}" >> apps/web/.env

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm --filter @spelling-creator/web build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
