packages:
  - "apps/*"
  - "packages/*"

# Build scripts allowed to run during install (union of both source repos).
allowBuilds:
  core-js: true
  esbuild: true
  "@google/genai": true
  protobufjs: true
  sharp: true
  workerd: true
  "@swc/core": true
  # tsParticles' install script only warns about conflicting legacy particle
  # packages (we have none), so there's nothing for it to do here.
  "@tsparticles/engine": false
  core-js-pure: true

patchedDependencies:
  "@cfworker/json-schema@4.1.1": patches/@cfworker__json-schema@4.1.1.patch
  "@modelcontextprotocol/client@2.0.0": patches/@modelcontextprotocol__client@2.0.0.patch
  "@modelcontextprotocol/server@2.0.0": patches/@modelcontextprotocol__server@2.0.0.patch
